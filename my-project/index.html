<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cool Website Name</title>
  </head>

  <body>
    <header class="bg-linear-to-r from-blue-500 to-cyan-500 py-10">
      <div
        class="max-w-6xl mx-auto px-6 flex flex-wrap items-center justify-between gap-4"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-14 h-14 rounded-2xl bg-white/20 flex items-center justify-center text-3xl"
          >
            <i data-lucide="House" class="w-7 h-7 text-white"></i>
          </div>

          <div>
            <span
              class="inline-flex items-center gap-2 bg-black/20 text-white text-xs font-semibold px-3 py-1 rounded-full"
            >
              <span class="w-2 h-2 rounded-full bg-cyan-300"></span>
              Sistem Piket Anak Kos
            </span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-1">
              Scheduled Pembagian Tugas KOS
            </h1>
            <p class="text-emerald-100 mt-1">
              Atur jadwal kebersihan kos secara adil, otomatis, dan anti-drama.
            </p>
          </div>
        </div>

        <!-- right side: button -->
        <button
          class="border border-white/30 bg-white/10 text-white font-medium px-4 py-2 rounded-lg hover:bg-white/20"
        >
          Do not press
        </button>
      </div>
    </header>

    <main
      class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-6"
    >
      <!-- left column -->
      <div class="space-y-6">
        <section class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold">1. Data Mahasiswa Kos</h2>
        </section>

        <section class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold">2. Daftar Tugas Kebersihan</h2>
        </section>

        <section class="bg-white rounded-2xl shadow p-6">
          <h2 class="text-lg font-bold">3. Metode Pembagian Jadwal</h2>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
